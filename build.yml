name: Build KISMET APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['www.zip', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack web app (www.zip)
        run: |
          rm -rf www && mkdir www && unzip -q www.zip -d www
          # allow zips that contain a single top folder
          if [ ! -f www/index.html ]; then
            d=$(dirname "$(find www -name index.html | head -1)")
            mv "$d"/* www/ || true
          fi
          test -f www/index.html
          if [ -d www/res-icons ]; then mv www/res-icons ./res-icons; fi

      - name: Publish web files to repo root (so in-app Update works)
        continue-on-error: true
        run: |
          rm -rf /tmp/web && mkdir -p /tmp/web && cp -r www/. /tmp/web/
          [ -d res-icons ] && cp -r res-icons /tmp/web/res-icons || true
          cp -r /tmp/web/. .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          (cd /tmp/web && find . -type f | sed 's#^\./##') > /tmp/web-files.txt
          xargs -a /tmp/web-files.txt -d '\n' git add -f --
          if ! git diff --cached --quiet; then git commit -m "Publish web files (auto)" && git push; fi

      - name: Make app work offline (download Tailwind + MQTT once)
        run: |
          mkdir -p www/vendor
          [ -s www/vendor/tailwind.js ] || curl -fsSL https://cdn.tailwindcss.com -o www/vendor/tailwind.js
          [ -s www/vendor/mqtt.min.js ] || curl -fsSL https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js -o www/vendor/mqtt.min.js
          test -s www/vendor/tailwind.js && test -s www/vendor/mqtt.min.js

      - name: Capacitor project
        run: |
          cat > package.json <<'JSON'
          {"name":"kismet","version":"1.0.0","private":true}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.kismet.app","appName":"KISMET","webDir":"www","android":{"allowMixedContent":true}}
          JSON
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/haptics@6 @capacitor/local-notifications@6
          npx cap add android
          npx cap sync android

      - name: Native gallery saver plugin (KismetSaver)
        run: |
          P=android/app/src/main/java/com/kismet/app
          mkdir -p $P
          cat > $P/KismetSaverPlugin.java <<'JAVA'
          package com.kismet.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "KismetSaver")
          public class KismetSaverPlugin extends Plugin {

              private Uri write(Uri collection, String name, String mime, String relPath, byte[] data) throws Exception {
                  ContentResolver r = getContext().getContentResolver();
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, relPath);
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  Uri uri = r.insert(collection, v);
                  if (uri == null) throw new Exception("MediaStore insert failed");
                  try (OutputStream os = r.openOutputStream(uri)) { os.write(data); }
                  ContentValues done = new ContentValues();
                  done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  r.update(uri, done, null, null);
                  return uri;
              }

              @PluginMethod
              public void saveImage(PluginCall call) {
                  try {
                      String b64 = call.getString("base64");
                      String name = call.getString("filename", "KISMET_" + System.currentTimeMillis() + ".png");
                      if (b64 == null) { call.reject("no image data"); return; }
                      int c = b64.indexOf(',');
                      if (b64.startsWith("data:") && c > 0) b64 = b64.substring(c + 1);
                      byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                      String low = name.toLowerCase();
                      String mime = (low.endsWith(".jpg") || low.endsWith(".jpeg")) ? "image/jpeg" : (low.endsWith(".webp") ? "image/webp" : "image/png");
                      Uri u = write(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, name, mime, Environment.DIRECTORY_PICTURES + "/KISMET", bytes);
                      JSObject o = new JSObject(); o.put("uri", u.toString()); call.resolve(o);
                  } catch (Exception e) { call.reject(e.getMessage()); }
              }

              @PluginMethod
              public void saveFile(PluginCall call) {
                  try {
                      String text = call.getString("text", "");
                      String name = call.getString("filename", "KISMET_" + System.currentTimeMillis() + ".csv");
                      String mime = call.getString("mime", "text/csv");
                      Uri u = write(MediaStore.Downloads.EXTERNAL_CONTENT_URI, name, mime, Environment.DIRECTORY_DOWNLOADS + "/KISMET", text.getBytes("UTF-8"));
                      JSObject o = new JSObject(); o.put("uri", u.toString()); call.resolve(o);
                  } catch (Exception e) { call.reject(e.getMessage()); }
              }
          }
          JAVA
          cat > $P/MainActivity.java <<'JAVA'
          package com.kismet.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(KismetSaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          # Android 10+ (MediaStore saving needs no storage permission)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 29/' android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M

      - name: App icon (from original KISMET apk)
        run: |
          if [ -d res-icons ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp res-icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/ || true
            done
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KISMET-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
